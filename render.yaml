# Despliegue en Render (F12, ADR 0007): el servidor de salas (servicio web gratuito, Virginia) y la
# web (sitio estático gratuito), los dos desde `main` y solo cuando pasan los checks del commit.
# Sin secretos: DATABASE_URL y ACCESS_KEY_HASH se escriben en el panel de Render (`sync: false`).
# Si Render agrega un sufijo a algún nombre, hay que ajustar ALLOWED_ORIGINS, VITE_SERVER_URL y la
# CSP de abajo (las comprueba tests/render-config.test.ts).
services:
  - type: web
    name: sudoku-killer-lima-ws
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    # `corepack enable` falla en Render (/usr/bin es de solo lectura): `corepack pnpm` no crea enlaces.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter "@sudoku-killer/server..." build
    # Node directo sobre lo compilado (lo mismo que `start` del servidor), sin depender de pnpm.
    startCommand: cd apps/server && node --env-file-if-exists=.env dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://sudoku-killer-lima.onrender.com
      # Render agrega una entrada a X-Forwarded-For (F12, S-01); se confirma en F12j.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_KEY_HASH
        sync: false

  - type: web
    name: sudoku-killer-lima
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter "@sudoku-killer/web..." build
    staticPublishPath: apps/web/dist
    # Cabeceras de seguridad (S-05): las mismas que apps/web/scripts/security-headers.ts.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' wss://sudoku-killer-lima-ws.onrender.com https://sudoku-killer-lima-ws.onrender.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      # En onrender.com, Render la reemplaza por la suya, más estricta (max-age de diez años,
      # includeSubdomains y preload); la prueba de humo acepta una HSTS igual o más estricta.
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: VITE_SERVER_URL
        value: wss://sudoku-killer-lima-ws.onrender.com/ws
