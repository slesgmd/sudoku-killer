name: Corpus

# Corpus del generador: 1000 puzzles con unicidad confirmada por los solvers A y B. Corpus del
# calificador: los mismos puzzles calificados, con cada deducción comprobada contra la
# solución. Cotas de `unitCombination`. Banco de puzzles: el manifiesto completo
# regenerado y verificado, con una partida simulada por puzzle (T-20.4 y T-20.5); este usa siempre
# las semillas del manifiesto. Puntuación: la validación de los parámetros vigentes, 10 000
# partidas simuladas con la semilla fija de `docs/puntuacion.md`. Es largo para la CI de cada push.
# Cada ejecución programada usa semillas nuevas en los corpus (desde run_number × 1000) y la manual
# permite elegirlas; el banco y la puntuación usan siempre las suyas. Una discrepancia o una
# deducción errónea bloquea: la semilla queda en el log.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      base_seed:
        description: "Primera semilla (vacío: la del número de ejecución)"
        required: false
      size:
        description: "Cantidad de puzzles"
        required: false
        default: "1000"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Choose the seeds
        run: |
          echo "CORPUS_BASE_SEED=${BASE_SEED:-$(( RUN_NUMBER * 1000 ))}" >> "$GITHUB_ENV"
          echo "CORPUS_SIZE=${SIZE:-1000}" >> "$GITHUB_ENV"
        env:
          BASE_SEED: ${{ inputs.base_seed }}
          SIZE: ${{ inputs.size }}
          RUN_NUMBER: ${{ github.run_number }}
      - run: pnpm test:corpus
