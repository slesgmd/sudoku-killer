name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  attribution-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Control case (the guard must fail)
        run: |
          control="$(mktemp -d)"
          git -C "$control" init -q
          echo "Y2hhdGdwdA==" | base64 -d > "$control/control.md"
          git -C "$control" add control.md
          if (cd "$control" && node "$GITHUB_WORKSPACE/scripts/attribution-guard.mjs" --files); then
            echo "The guard did not detect the control case."
            exit 1
          fi
      - name: Versioned files
        run: node scripts/attribution-guard.mjs --files
      - name: Commits of the push
        if: github.event_name == 'push'
        run: node scripts/attribution-guard.mjs --push "$BEFORE" "$AFTER" "$BRANCH"
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
      - name: Commits of the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/attribution-guard.mjs --range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
