name: Humo del despliegue

# Prueba de humo del despliegue (ADR 0007), a mano: TLS de la web y del servidor, la
# redirección de http a https, `/healthz` (espera hasta 2 min a que el servidor despierte) y el
# handshake del WebSocket con un origen ajeno (403) y con el de la web, y `POST /access` según el
# acceso esperado (T-39.17 y T-39.22). Los logs de Actions son
# públicos: todo paso corre con `scripts/ci/quiet.ts`, que solo deja pasar `smoke.<prueba>: ok|fail`
# (docs/seguridad.md §3; lo comprueba tests/workflow-logs.test.ts).
# Con `custom_domain`, repite la prueba desde el dominio propio de la web (R-41). Su dirección viene
# de un secreto, no de una variable ni de una entrada: los logs muestran el `env` de cada paso, y solo
# un secreto sale enmascarado. Sin el secreto, la prueba falla; nunca se omite en silencio.

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Web (https://…)"
        required: true
        default: "https://sudoku-killer-lima.onrender.com"
      server_url:
        description: "Servidor (wss://…/ws)"
        required: true
        default: "wss://sudoku-killer-lima-ws.onrender.com/ws"
      access:
        description: "Acceso esperado: closed (con clave) u open"
        required: true
        default: "open"
        type: choice
        options:
          - open
          - closed
      custom_domain:
        description: "Probar también el dominio propio de la web"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/ci/quiet.ts -- pnpm install --frozen-lockfile
      - name: Smoke
        run: node scripts/ci/quiet.ts -- pnpm --filter @sudoku-killer/server smoke
        env:
          SMOKE_WEB_URL: ${{ inputs.web_url }}
          SMOKE_SERVER_URL: ${{ inputs.server_url }}
          SMOKE_ACCESS: ${{ inputs.access }}
      - name: Smoke from the custom domain
        if: ${{ !cancelled() && inputs.custom_domain }}
        run: node scripts/ci/quiet.ts -- pnpm --filter @sudoku-killer/server smoke
        env:
          SMOKE_WEB_URL: ${{ secrets.SMOKE_CUSTOM_WEB_URL }}
          SMOKE_SERVER_URL: ${{ inputs.server_url }}
          SMOKE_ACCESS: ${{ inputs.access }}
